<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin CMS — Priyanshu's Portfolio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙</text></svg>">
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>

  <!-- LOGIN OVERLAY -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-card">
      <div class="login-header">
        <h1>PRIYANSHU CMS</h1>
        <p>Sign in to manage portfolio content & publish changes</p>
      </div>

      <div id="login-error" class="btn-admin-danger" style="display: none; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; text-align: center;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-username">Admin Username</label>
          <input type="text" id="login-username" class="form-control" required placeholder="Enter username" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit" class="btn-admin btn-admin-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
          Log In to Admin Panel
        </button>
      </form>
    </div>
  </div>

  <!-- ADMIN MAIN LAYOUT -->
  <div id="admin-layout" style="display: none; width: 100%; min-height: 100vh;">
    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <h2>PRIYANSHU<span style="color: var(--accent-primary);">.</span>CMS</h2>
      </div>

      <ul class="sidebar-nav">
        <li class="nav-item">
          <button data-tab="dashboard" class="active">📊 Dashboard</button>
        </li>
        <li class="nav-item">
          <button data-tab="sections">⚙ Dynamic Sections</button>
        </li>
        <li class="nav-item">
          <button data-tab="projects">📁 Projects</button>
        </li>
        <li class="nav-item">
          <button data-tab="skills">⚡ Skills & Stack</button>
        </li>
        <li class="nav-item">
          <button data-tab="experience">💼 Work Experience</button>
        </li>
        <li class="nav-item">
          <button data-tab="achievements">🏆 Key Achievements</button>
        </li>
        <li class="nav-item">
          <button data-tab="blogs">📝 Writing & Journal</button>
        </li>
      </ul>

      <div class="sidebar-footer">
        <button id="logout-btn" class="btn-admin btn-admin-danger" style="width: 100%;">
          Sign Out
        </button>
      </div>
    </aside>

    <!-- MAIN WORKSPACE AREA -->
    <main class="admin-main">
      <header class="admin-topbar">
        <div id="topbar-title" class="topbar-title">Dashboard Management</div>
        <div>
          <button id="publish-site-btn" class="publish-cta-btn">
            🚀 PUBLISH TO WEBSITE
          </button>
        </div>
      </header>

      <div id="admin-main-view" class="admin-content">
        <!-- SPA views render here -->
      </div>
    </main>
  </div>

  <!-- SCRIPTS -->
  <script src="js/api.js"></script>
  <script src="js/admin-app.js"></script>
</body>
</html>
