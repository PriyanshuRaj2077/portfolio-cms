<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12141c" />
      <stop offset="100%" stop-color="#0b0c10" />
    </linearGradient>

    <!-- Accent Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff724e" />
      <stop offset="100%" stop-color="#ff5e36" />
    </linearGradient>

    <!-- Accent Purple Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f75ff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Geometric Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Rectangle -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Grid Layer -->
  <rect width="800" height="1000" fill="url(#grid)" />

  <!-- Abstract Editorial Geometry -->
  <circle cx="400" cy="420" r="280" fill="none" stroke="rgba(255, 94, 54, 0.12)" stroke-width="1.5" stroke-dasharray="8 8" />
  <circle cx="400" cy="420" r="220" fill="none" stroke="rgba(139, 92, 246, 0.15)" stroke-width="1" />

  <!-- Geometric Developer Silhouette -->
  <!-- Shoulders -->
  <path d="M 180 820 C 180 660, 260 600, 400 600 C 540 600, 620 660, 620 820 Z" fill="#181a26" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  
  <!-- Neck -->
  <rect x="360" y="520" width="80" height="100" rx="12" fill="#1f2233" />
  
  <!-- Head Frame -->
  <path d="M 280 360 C 280 240, 330 180, 400 180 C 470 180, 520 240, 520 360 C 520 480, 460 530, 400 530 C 340 530, 280 480, 280 360 Z" fill="#1c1e2d" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Sleek Modern Glasses / Developer Interface Anchor -->
  <rect x="310" y="320" width="80" height="48" rx="8" fill="none" stroke="url(#orangeGrad)" stroke-width="3" />
  <rect x="410" y="320" width="80" height="48" rx="8" fill="none" stroke="url(#orangeGrad)" stroke-width="3" />
  <line x1="390" y1="344" x2="410" y2="344" stroke="url(#orangeGrad)" stroke-width="3" />

  <!-- Code Brackets Overlay -->
  <text x="120" y="300" font-family="monospace" font-size="72" font-weight="bold" fill="url(#orangeGrad)" opacity="0.3">&lt;/&gt;</text>
  <text x="600" y="650" font-family="monospace" font-size="64" font-weight="bold" fill="url(#purpleGrad)" opacity="0.3">{...}</text>

  <!-- Glowing Accent Dots -->
  <circle cx="350" cy="344" r="5" fill="#ff5e36" />
  <circle cx="450" cy="344" r="5" fill="#8b5cf6" />

  <!-- Framing Overlay Lines -->
  <line x1="60" y1="60" x2="160" y2="60" stroke="#ff5e36" stroke-width="2" />
  <line x1="60" y1="60" x2="60" y2="160" stroke="#ff5e36" stroke-width="2" />

  <line x1="740" y1="940" x2="640" y2="940" stroke="#8b5cf6" stroke-width="2" />
  <line x1="740" y1="940" x2="740" y2="840" stroke="#8b5cf6" stroke-width="2" />

  <!-- Label Overlay inside SVG -->
  <text x="60" y="930" font-family="sans-serif" font-size="18" font-weight="bold" letter-spacing="4" fill="#a0a5b5" opacity="0.6">PRIYANSHU • BUILDER IDENTITY</text>
</svg>
