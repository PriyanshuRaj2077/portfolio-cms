<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <meta name="description" id="meta-description" content="Portfolio — Systems, Software & Architecture.">
  <meta name="theme-color" content="#E84025">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS Design Tokens & Modules -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/hero.css">
  <link rel="stylesheet" href="/css/sections.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <!-- MAC-STYLE MINIMAL SIDEBAR NAVIGATION RAIL -->
  <aside class="mac-sidebar" id="mac-sidebar" aria-label="Main Navigation">
    <div class="sidebar-top">
      <a href="#hero" class="sidebar-home-btn" id="sidebar-home-link" aria-label="Home">
        <span class="icon-mark">◉</span>
      </a>
    </div>
    
    <nav class="sidebar-nav">
      <ul id="dynamic-nav-links" class="sidebar-menu">
        <!-- Dynamically populated from published sections -->
      </ul>
    </nav>
  </aside>

  <!-- MAIN VIEW WRAPPER -->
  <div class="site-main-wrapper">

    <!-- PORTFOLIO MAIN VIEW -->
    <div id="portfolio-view">
      <!-- PERMANENT HERO SECTION (Outside Dynamic Sections Container) -->
      <section id="hero" class="hero-section">
        <div class="container hero-grid">
          <div class="hero-content">
            <h1 id="hero-display-name" class="hero-title"></h1>
            <div id="hero-subtitle" class="hero-subtitle"></div>
            <p id="hero-bio" class="hero-bio-short"></p>
            <div class="hero-actions">
              <a href="#sec-projects" class="btn-minimal" id="hero-work-btn">View Work ↘</a>
              <a href="#sec-contact" class="btn-minimal-muted" id="hero-contact-btn">Contact ↘</a>
            </div>
          </div>

          <div class="hero-visual">
            <div class="hero-image-container">
              <img id="hero-avatar-img" class="hero-portrait" src="" alt="" style="display: none;" />
            </div>
          </div>
        </div>
      </section>

      <!-- DYNAMIC CMS SECTIONS CONTAINER -->
      <main id="sections-container">
        <!-- Published sections render here dynamically -->
      </main>

      <!-- Site Footer -->
      <footer class="site-footer">
        <div class="container footer-inner">
          <div>
            <span>© <span id="footer-year"></span> <span id="footer-name"></span>. All rights reserved.</span>
          </div>
          <div id="footer-meta-extra">
            <!-- Configurable site metadata -->
          </div>
        </div>
      </footer>
    </div>

    <!-- DEDICATED ARTICLE VIEW (For /blog/<slug>) -->
    <div id="article-view" style="display: none;">
      <article class="article-page-container container">
        <div class="article-page-nav">
          <a href="/" id="article-back-btn" class="article-back-link">← Back to Overview</a>
        </div>

        <!-- Featured image — rendered above header if present -->
        <div id="article-featured-image-container" style="display:none;">
          <img id="article-featured-img" class="article-featured-image" src="" alt="Article featured image">
        </div>

        <header class="article-page-header">
          <div class="article-page-meta">
            <span id="article-date-meta" class="article-meta-item"></span>
            <span id="article-read-meta" class="article-meta-item"></span>
          </div>
          <h1 id="article-title-heading" class="article-page-title"></h1>
          <p id="article-summary-lead" class="article-page-summary"></p>
          <div id="article-tags-container" class="article-page-tags"></div>
        </header>
        <div id="article-body-content" class="article-page-body"></div>

        <!-- Comments section -->
        <section id="article-comments-section" class="article-comments-section">
          <h2 class="comments-heading">Reader Comments</h2>

          <!-- Pending own comment notice -->
          <div id="article-pending-comment-notice" style="display:none;" class="pending-comment-notice">
            <span class="pending-badge">⏳ Pending Approval</span>
            <span id="article-pending-comment-preview" class="pending-comment-text"></span>
          </div>

          <!-- Approved comments list -->
          <div id="article-comments-list" class="comments-list"></div>

          <!-- Submit form -->
          <div class="comment-form-wrapper">
            <h3 class="comment-form-title">Leave a Comment</h3>
            <form id="article-comment-form" class="comment-form" novalidate>
              <div class="comment-form-row">
                <div class="comment-form-field">
                  <label class="comment-form-label" for="comment-author-name">Name *</label>
                  <input type="text" id="comment-author-name" class="comment-form-input" maxlength="100" placeholder="Your name" required autocomplete="name">
                </div>
              </div>
              <div class="comment-form-field">
                <label class="comment-form-label" for="comment-content-text">Comment *</label>
                <textarea id="comment-content-text" class="comment-form-textarea" maxlength="2000" rows="4" placeholder="Share your thoughts..." required></textarea>
              </div>
              <div id="comment-form-status" class="comment-form-status" style="display:none;"></div>
              <button type="submit" id="comment-submit-btn" class="comment-submit-btn">Post Comment →</button>
            </form>
          </div>
        </section>
      </article>

      <footer class="site-footer">
        <div class="container footer-inner">
          <div>
            <span>© <span id="article-footer-year"></span> <span id="article-footer-name"></span>. All rights reserved.</span>
          </div>
        </div>
      </footer>
    </div>

  </div>

  <!-- Scripts -->
  <script src="/js/config.js"></script>
  <script src="/js/renderer.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
