<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priyanshu's Portfolio</title>
  <meta name="description" content="Personal portfolio of Priyanshu — Systems, Software & Architecture.">
  <meta name="theme-color" content="#0b0b0b">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS Design Tokens & Modules -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/sections.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- MAC-STYLE MINIMAL SIDEBAR NAVIGATION RAIL -->
  <aside class="mac-sidebar" id="mac-sidebar" aria-label="Main Navigation">
    <div class="sidebar-top">
      <a href="#hero" class="sidebar-home-btn" aria-label="Home">
        <span class="icon-mark">◉</span>
      </a>
    </div>
    
    <nav class="sidebar-nav">
      <ul id="dynamic-nav-links" class="sidebar-menu">
        <!-- Dynamically populated from published sections -->
      </ul>
    </nav>
  </aside>

  <!-- MAIN VIEW WRAPPER -->
  <div class="site-main-wrapper">

    <!-- PERMANENT HERO SECTION (Outside Dynamic Sections Container) -->
    <section id="hero" class="hero-section">
      <div class="container hero-grid">
        <div class="hero-content">
          <h1 id="hero-display-name" class="hero-title">PRIYANSHU</h1>
          <div id="hero-subtitle" class="hero-subtitle"></div>
          <p id="hero-bio" class="hero-bio-short"></p>
          <div class="hero-actions">
            <a href="#sec-projects" class="btn-minimal">View Work ↘</a>
            <a href="#sec-contact" class="btn-minimal-muted">Contact ↘</a>
          </div>
        </div>

        <div class="hero-visual">
          <div class="hero-image-container">
            <img id="hero-avatar-img" class="hero-portrait" src="" alt="" style="display: none;" />
          </div>
        </div>
      </div>
    </section>

    <!-- DYNAMIC CMS SECTIONS CONTAINER -->
    <main id="sections-container">
      <!-- Published sections render here dynamically -->
    </main>

    <!-- Site Footer -->
    <footer class="site-footer">
      <div class="container footer-inner">
        <div>
          <span>© <span id="footer-year"></span> <span id="footer-name">Priyanshu</span>. All rights reserved.</span>
        </div>
        <div id="footer-meta-extra">
          <!-- Configurable site metadata -->
        </div>
      </div>
    </footer>

  </div>

  <!-- ARTICLE READER MODAL (For Blogs) -->
  <div id="article-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card">
      <button id="modal-close-btn" class="modal-close" aria-label="Close article">✕</button>
      <div id="modal-content" class="modal-body"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
