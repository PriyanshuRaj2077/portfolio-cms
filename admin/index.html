<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal — CMS</title>
  <meta name="theme-color" content="#0b0b0b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>

  <!-- LOGIN OVERLAY -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-card">
      <div class="login-header">
        <h1>PORTFOLIO CMS</h1>
        <p>Authentication required</p>
      </div>

      <div id="login-error" class="login-error" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-username">Username</label>
          <input type="text" id="login-username" class="form-input" required placeholder="admin" autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In ↘
        </button>
      </form>
    </div>
  </div>

  <!-- ADMIN MAIN LAYOUT -->
  <div id="admin-layout" class="admin-layout" style="display: none;">
    <!-- SIDEBAR BACKDROP FOR MOBILE -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- SIDEBAR -->
    <aside id="admin-sidebar" class="admin-sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-text">
          <span class="sidebar-brand-title">PORTFOLIO</span>
          <span class="sidebar-brand-badge">// CMS</span>
        </div>
        <button id="sidebar-close-btn" class="sidebar-close-btn" aria-label="Close Menu">✕</button>
      </div>

      <ul class="sidebar-nav">
        <li class="nav-item">
          <button data-tab="profile" class="nav-btn active">
            <span>Profile</span>
            <span class="nav-letter-indicator">01</span>
          </button>
        </li>
        <li class="nav-item">
          <button data-tab="sections" class="nav-btn">
            <span>Sections</span>
            <span class="nav-letter-indicator">02</span>
          </button>
        </li>
        <li class="nav-item">
          <button data-tab="projects" class="nav-btn">
            <span>Projects</span>
            <span class="nav-letter-indicator">03</span>
          </button>
        </li>
        <li class="nav-item">
          <button data-tab="skills" class="nav-btn">
            <span>Tech Stack</span>
            <span class="nav-letter-indicator">04</span>
          </button>
        </li>
        <li class="nav-item">
          <button data-tab="experience" class="nav-btn">
            <span>Experience</span>
            <span class="nav-letter-indicator">05</span>
          </button>
        </li>
        <li class="nav-item">
          <button data-tab="achievements" class="nav-btn">
            <span>Achievements</span>
            <span class="nav-letter-indicator">06</span>
          </button>
        </li>
        <li class="nav-item">
          <button data-tab="blogs" class="nav-btn">
            <span>Blogs</span>
            <span class="nav-letter-indicator">07</span>
          </button>
        </li>
        <li class="nav-item">
          <button data-tab="media" class="nav-btn">
            <span>Media Library</span>
            <span class="nav-letter-indicator">08</span>
          </button>
        </li>
        <li class="nav-item">
          <button data-tab="comments" class="nav-btn">
            <span>Comments</span>
            <span class="nav-letter-indicator">09</span>
          </button>
        </li>
      </ul>

      <div class="sidebar-footer">
        <button id="sidebar-publish-btn" class="btn btn-publish" style="width: 100%;">
          Publish ↗
        </button>
        <button id="logout-btn" class="btn btn-secondary btn-sm" style="width: 100%;">
          Sign Out
        </button>
      </div>
    </aside>

    <!-- MAIN WORKSPACE -->
    <main class="admin-main">
      <header class="admin-topbar">
        <div class="topbar-left">
          <button id="mobile-menu-toggle" class="mobile-menu-toggle" aria-label="Toggle navigation menu">
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
          </button>
          <div id="topbar-title" class="topbar-title">Profile Management</div>
        </div>
        <div class="topbar-actions">
          <button id="publish-site-btn" class="btn btn-publish btn-sm">
            Publish ↗
          </button>
        </div>
      </header>

      <div id="admin-main-view" class="admin-content-area">
        <!-- SPA view rendered dynamically by admin-app.js -->
      </div>
    </main>
  </div>

  <!-- SCRIPTS -->
  <script src="js/api.js"></script>
  <script src="js/admin-app.js"></script>
</body>
</html>
