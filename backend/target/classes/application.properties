# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration (Defaults to embedded H2 PostgreSQL mode for zero-setup local dev)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${JDBC_DATABASE_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Custom Publishing System Configuration
portfolio.publish.output-dir=../frontend/data/published/default
portfolio.publish.public-base-url=./data/published/default
