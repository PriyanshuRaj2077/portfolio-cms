# ==============================================================================
# LOCAL DEVELOPMENT PROFILE (dev)
# Activated with: -Dspring-boot.run.profiles=dev or --spring.profiles.active=dev
# ==============================================================================

# Enable H2 Web Console for local inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Show formatted SQL in development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Default admin credentials for local zero-setup development
admin.username=admin
admin.initial-password=AdminPassword123!
