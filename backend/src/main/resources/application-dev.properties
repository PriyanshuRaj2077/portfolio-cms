# ==============================================================================
# LOCAL DEVELOPMENT PROFILE (dev)
# Activated with: -Dspring-boot.run.profiles=dev or --spring.profiles.active=dev or SPRING_PROFILES_ACTIVE=dev
# ==============================================================================

# Embedded H2 Database in PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Enable H2 Web Console for local inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Show formatted SQL in development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Default admin credentials for local zero-setup development
admin.username=admin
admin.initial-password=AdminPassword123!

# Local Storage Directory Paths
portfolio.publish.output-dir=../frontend/data/published/default
portfolio.media.output-dir=../frontend/media
portfolio.publish.public-base-url=/data/published/default
portfolio.media.public-base-url=/media

# Development CORS origins
portfolio.cors.frontend-origin=http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500,http://localhost:5173
