# ==============================================================================
# BASE APPLICATION CONFIGURATION (Production Defaults)
# ==============================================================================

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Neon PostgreSQL Database Configuration (Environment-driven for Render/Neon)
spring.datasource.url=${JDBC_DATABASE_URL:${SPRING_DATASOURCE_URL:}}
spring.datasource.username=${JDBC_DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=${JDBC_DATABASE_DRIVER:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# H2 Console (Disabled in production for security)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Supabase S3-Compatible Object Storage Configuration
portfolio.supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT:}
portfolio.supabase.s3.region=${SUPABASE_S3_REGION:}
portfolio.supabase.s3.access-key-id=${SUPABASE_S3_ACCESS_KEY_ID:}
portfolio.supabase.s3.secret-access-key=${SUPABASE_S3_SECRET_ACCESS_KEY:}
portfolio.supabase.s3.bucket=${SUPABASE_S3_BUCKET:}

# Local Storage Fallback Directories (Used strictly in dev/test)
portfolio.publish.output-dir=../frontend/data/published/default
portfolio.media.output-dir=../frontend/media
portfolio.publish.public-base-url=/data/published/default
portfolio.media.public-base-url=/media

# CORS Configuration (Vercel Frontend Origin)
portfolio.cors.frontend-origin=${FRONTEND_ORIGIN:}
