# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration (Auto-detects driver from JDBC URL; defaults to embedded H2 PostgreSQL mode for zero-setup local dev)
spring.datasource.url=${JDBC_DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.username=${JDBC_DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=${JDBC_DATABASE_DRIVER:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Disabled by default for production safety; enabled in dev profile)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Custom Publishing System Configuration
portfolio.publish.output-dir=../frontend/data/published/default
portfolio.publish.public-base-url=./data/published/default

